[package]
name = "mnhr-org"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
dotenv = { package = "dotenv-ng", version = "1.0.0" }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio"] }
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "rt-multi-thread"] }
serde_json = "1.0.154"
url = "2.5.8"
regex = "1.13.1"

[dev-dependencies]
hyper = { version = "1.12.0", features = ["client"] }
